# Block access to development configuration files
<Directory "/var/www/html">
    <FilesMatch "^(\.env.*|compose\.ya?ml|Dockerfile|apache-security\.conf|README\.md|\.gitignore|\.htaccess)$">
        Require all denied
    </FilesMatch>
</Directory>

# Block access to Git metadata
<DirectoryMatch "^/var/www/html/\.git(/|$)">
    Require all denied
</DirectoryMatch>